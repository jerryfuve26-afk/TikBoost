<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b18"><link rel="manifest" href="manifest.json"><title>TikBoost 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050817;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#090d20,#07101d);padding-bottom:92px}header{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:27px}.logo span{color:#16d9ff}.logo b{color:#ff2d9a}.icon{width:40px;height:40px;border-radius:13px;background:#121b38;display:grid;place-items:center}h1{font-size:27px;margin:10px 18px 4px}.sub{margin:0 18px 18px;color:#9eb0ce;font-size:14px}.hero{margin:0 18px 18px;padding:20px;border-radius:22px;background:linear-gradient(120deg,#ff1593,#6b28ff 65%,#0bd9ff);box-shadow:0 15px 40px #0005}.hero h2{margin:0 0 6px}.hero p{margin:0 0 15px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;color:#fff;background:#11162d}.btn.primary{background:#ff1696}.btn.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}.stat,.feature,.panel{background:#0d1730;border:1px solid #1e3158;border-radius:18px;padding:15px}.stat strong{display:block;font-size:23px}.muted{color:#91a4c5;font-size:12px}.section{padding:0 18px}.title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.title h2{margin:0;font-size:19px}.filters{display:flex;gap:8px;overflow:auto;padding:0 18px 15px}.chip{border:1px solid #26365d;background:#101a34;color:#b9c7df;border-radius:22px;padding:10px 14px;white-space:nowrap;font-weight:700}.chip.active{background:linear-gradient(90deg,#ff1493,#6738ff);color:#fff;border:0}.card{display:flex;gap:12px;padding:12px;margin-bottom:10px;border:1px solid #1e3158;background:#0c1530;border-radius:18px;cursor:pointer}.thumb{width:70px;height:70px;border-radius:13px;display:grid;place-items:center;font-size:28px;flex:none;background:linear-gradient(135deg,#f72585,#4361ee)}.card h3{margin:0 0 4px;font-size:14px}.card p{margin:0;color:#91a4c5;font-size:12px}.stats{margin-left:auto;color:#ff4cad;font-size:11px;font-weight:800;white-space:nowrap}.tags{display:flex;gap:5px;margin-top:7px}.tag{font-size:10px;background:#17234a;color:#a9c3ff;border-radius:10px;padding:4px 7px}.feature{display:flex;gap:12px;margin-bottom:10px}.feature .ico{font-size:27px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:9px 2px;background:#111d3b;border-radius:9px;text-align:center;font-size:11px}.day.on{background:#ff1696}.bar{height:8px;background:#1a2747;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff1696,#0bd9ff)}.premium{background:linear-gradient(135deg,#1b1240,#32104a);border:1px solid #9b43ff}.price{font-size:30px;font-weight:900}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:10}.sheet{width:min(480px,100%);margin:auto;background:#0b1227;border-radius:24px 24px 0 0;padding:22px;max-height:90vh;overflow:auto}.close{float:right;background:#182344;color:#fff;border:0;border-radius:10px;padding:8px}.block{background:#111c39;border:1px solid #22365e;border-radius:15px;padding:14px;margin-top:10px}.block b{display:block;margin-bottom:6px}.copy{float:right;background:#26375e;color:#fff;border:0;border-radius:8px;padding:5px 8px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:78px;background:#090d1d;border-top:1px solid #1d2a49;display:flex;justify-content:space-around;padding-top:8px;z-index:5}nav button{background:none;border:0;color:#7e90b1;font-size:10px;font-weight:700}nav button.active{color:#ff35a4}nav .ni{font-size:21px;display:block;margin-bottom:3px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-weight:800;display:none;z-index:20}
</style></head><body><div class="app"><header><div class="logo">Tik<span>Boost</span><b>↗</b></div><div class="icon">👤</div></header><main id="main"></main></div><nav id="nav"><button data-page="home" class="active"><span class="ni">⌂</span>Inicio</button><button data-page="ideas"><span class="ni">💡</span>Ideas</button><button data-page="calendar"><span class="ni">▦</span>Calendario</button><button data-page="analytics"><span class="ni">▥</span>Análisis</button><button data-page="profile"><span class="ni">♙</span>Perfil</button></nav><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="detail"></div></div></div><div class="toast" id="toast"></div>
<script>
const ideas=[
{cat:'Comida',emoji:'🍗',title:'Reto de comida en 1 minuto',desc:'Prueba un plato y muestra una reacción real.',views:'98K',hook:'¿Te atreverías a comer esto en 1 minuto?',script:'Muestra el plato → prueba → reacción → pregunta si lo probarían.',shot:'Primer plano del plato y luego tu cara.',text:'¿Lo probarías? 🔥',tags:'#Comida #RetoComida #ReacciónReal'},
{cat:'Viajes',emoji:'🏞️',title:'El lugar que casi nadie conoce',desc:'Muestra un lugar bonito y cuenta un dato curioso.',views:'76K',hook:'Esto está cerca y casi nadie lo conoce…',script:'Llega → mejor plano → dato → invita a comentar.',shot:'Empieza con el plano más impactante.',text:'¿Conocías este lugar? 👀',tags:'#Perú #Lugares #ParaTi'},
{cat:'Vida diaria',emoji:'✨',title:'Antes y después',desc:'Comparte una transformación real.',views:'62K',hook:'Espera a ver cómo quedó al final…',script:'Antes → proceso → resultado → pregunta.',shot:'Usa una transición entre antes y después.',text:'ANTES 😱 → DESPUÉS 🔥',tags:'#Transformación #AntesYDespués #ParaTi'},
{cat:'Comedia',emoji:'😂',title:'Cuando dices “solo un minuto”',desc:'Una situación cotidiana con un remate.',views:'54K',hook:'Yo: solo entro un minuto… También yo:',script:'Plantea → exagera → remate final.',shot:'Actúa dos personajes.',text:'Solo un minuto… 😂',tags:'#Comedia #Humor #Situaciones'},
{cat:'Consejos',emoji:'💡',title:'3 cosas que aprendí a las malas',desc:'Tres aprendizajes útiles y reales.',views:'48K',hook:'Ojalá alguien me hubiera dicho esto antes…',script:'Consejo 1 → ejemplo → consejo 2 → ejemplo → consejo 3.',shot:'Mira a cámara y muestra cada número.',text:'3 cosas que debes saber 👇',tags:'#Consejos #Aprendizaje #Vida'}];
let page='home', filter='Todas'; const saved=()=>JSON.parse(localStorage.getItem('tb_saved')||'[]');
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}
function home(){return `<h1>🚀 Tu crecimiento</h1><p class="sub">Tu asistente para crear mejor contenido.</p><div class="hero"><h2>⚡ Genera una idea ahora</h2><p>Obtén un gancho, guion, texto y hashtags en segundos.</p><button class="btn" onclick="generate()">Dame una idea viral →</button></div><div class="grid"><div class="stat"><strong>${localStorage.getItem('tb_ideas')||0}</strong><span class="muted">Ideas generadas</span></div><div class="stat"><strong>${saved().length}</strong><span class="muted">Ideas guardadas</span></div></div><div class="section"><div class="title"><h2>🔥 Herramientas</h2></div><div class="feature"><div class="ico">🤖</div><div><b>Generador con IA</b><div class="muted">Ideas, hooks, guiones y captions.</div></div></div><div class="feature"><div class="ico">📅</div><div><b>Plan semanal</b><div class="muted">Organiza qué publicar cada día.</div></div></div><div class="feature"><div class="ico">📊</div><div><b>Análisis</b><div class="muted">Registra tus métricas y descubre qué funciona.</div></div></div><div class="panel premium"><b>👑 TikBoost Premium</b><p class="muted">Sin anuncios + más ideas + funciones avanzadas.</p><div class="price">S/ 9.90 <small>/mes</small></div><button class="btn primary full" onclick="premium()">Ver Premium</button></div></div>`}
function ideasPage(){let arr=filter==='Todas'?ideas:ideas.filter(x=>x.cat===filter);return `<h1>💡 Ideas virales</h1><p class="sub">Ideas para inspirarte y crear contenido.</p><div class="filters">${['Todas','Comedia','Comida','Vida diaria','Consejos','Viajes'].map(c=>`<button class="chip ${filter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('')}</div><section class="section"><div class="title"><h2>🔥 Para ti</h2><span class="muted">${arr.length} ideas</span></div>${arr.map((x,i)=>`<div class="card" onclick='openIdea(${JSON.stringify(x)})'><div class="thumb">${x.emoji}</div><div style="flex:1"><h3>${x.title}</h3><p>${x.desc}</p><div class="tags"><span class="tag">${x.cat}</span><span class="tag">🔥 Viral</span></div></div><div class="stats">🔥 ${x.views}</div></div>`).join('')}</section>`}
function calendar(){return `<h1>📅 Calendario</h1><p class="sub">Planifica 7 días de contenido.</p><section class="section"><div class="panel"><div class="calendar">${['L','M','X','J','V','S','D'].map((d,i)=>`<div class="day ${i===2||i===5?'on':''}">${d}<br><b>${14+i}</b></div>`).join('')}</div></div><div class="title"><h2>Publicaciones</h2></div>${['Lunes · Consejo rápido','Martes · Video de comida','Miércoles · Comedia','Jueves · Antes y después'].map((x,i)=>`<div class="feature"><div class="ico">${['💡','🍗','😂','✨'][i]}</div><div><b>${x}</b><div class="muted">${i%2?'7:30 p. m.':'6:30 p. m.'}</div></div></div>`).join('')}</section>`}
function analytics(){let n=Number(localStorage.getItem('tb_ideas')||0);return `<h1>📊 Análisis</h1><p class="sub">Registra tus resultados para aprender qué contenido funciona.</p><section class="section"><div class="grid" style="padding:0"><div class="stat"><strong>${n*12}</strong><span class="muted">Videos registrados</span></div><div class="stat"><strong>${n*850}</strong><span class="muted">Vistas de ejemplo</span></div></div><div class="title"><h2>Rendimiento</h2></div><div class="panel"><p class="muted">Retención promedio · 68%</p><div class="bar"><i style="width:68%"></i></div><p class="muted">Interacción · 7.4%</p><div class="bar"><i style="width:74%"></i></div><p class="muted">Constancia · 82%</p><div class="bar"><i style="width:82%"></i></div></div><p class="muted">Estas métricas son demostrativas hasta conectar datos reales de tu cuenta/plataforma.</p></section>`}
function profile(){return `<h1>♙ Perfil</h1><p class="sub">Configura tu experiencia.</p><section class="section"><div class="panel"><b>Plan actual</b><h2 style="margin-bottom:4px">Gratis</h2><div class="muted">Ideas y herramientas básicas</div><button class="btn primary full" style="margin-top:14px" onclick="premium()">👑 Pasar a Premium</button></div><div class="title"><h2>Monetización</h2></div><div class="feature"><div class="ico">🎁</div><div><b>Ver anuncio y desbloquear</b><div class="muted">En la versión final: mira un anuncio bonificado para recibir ideas extra.</div></div></div><div class="feature"><div class="ico">💳</div><div><b>Premium</b><div class="muted">En la versión final: suscripción mediante Google Play.</div></div></div></section>`}
function render(){document.getElementById('main').innerHTML=page==='home'?home():page==='ideas'?ideasPage():page==='calendar'?calendar():page==='analytics'?analytics():profile();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function setFilter(c){filter=c;page='ideas';render()} function generate(){let x=ideas[Math.floor(Math.random()*ideas.length)];localStorage.setItem('tb_ideas',Number(localStorage.getItem('tb_ideas')||0)+1);openIdea({...x,title:'✨ '+x.title+' — Nueva idea'})}
function openIdea(x){document.getElementById('detail').innerHTML=`<div style="color:#ff48aa;font-weight:900;font-size:12px">🔥 IDEA · ${x.cat.toUpperCase()}</div><h2>${x.title}</h2><p class="muted">${x.desc}</p>${[['🔗 Gancho',x.hook],['📝 Guion',x.script],['🎥 Qué grabar',x.shot],['Aa Texto',x.text],['# Hashtags',x.tags]].map(([a,b])=>`<div class="block"><button class="copy" onclick='copyText(${JSON.stringify(b)})'>Copiar</button><b>${a}</b>${b}</div>`).join('')}<div class="block"><b>⏰ Consejo</b>Prueba distintos horarios y compara tus resultados. No hay garantía de viralidad.</div><button class="btn primary full" style="margin-top:14px" onclick='save(${JSON.stringify(x.title)})'>🔖 Guardar idea</button>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'} function copyText(t){navigator.clipboard?.writeText(t);toast('Copiado')} function save(t){let a=saved();if(!a.includes(t))a.push(t);localStorage.setItem('tb_saved',JSON.stringify(a));toast('Idea guardada')} function premium(){toast('Premium: integración de pago pendiente')} 
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()}); if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); render();
</script></body></html>
