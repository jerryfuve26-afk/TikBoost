<title>TikBoost 3.0</title>
<style>
:root{--bg:#060814;--card:#0d1730;--line:#203255;--text:#f8faff;--muted:#93a4c3;--cyan:#19d8ff;--pink:#ff3b9d;--violet:#7c4dff;--green:#2de2a7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2b55 0,#070a16 38%,#050711 78%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding-bottom:96px;position:relative}header{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(180deg,#060814f7,#060814cc,transparent);backdrop-filter:blur(14px)}.logo{font-size:27px;font-weight:950;letter-spacing:-1px}.logo span{background:linear-gradient(90deg,var(--cyan),#a8f3ff);-webkit-background-clip:text;color:transparent}.logo b{color:var(--pink)}.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid #22345b;background:#101a33;color:#fff}.page-head{padding:8px 18px 0}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8ce6ff;font-weight:900}.page-head h1{font-size:30px;line-height:1.04;margin:6px 0 7px;letter-spacing:-1px}.sub,.muted{color:var(--muted);font-size:12px;line-height:1.5}.hero{margin:16px 18px;padding:22px;border-radius:26px;background:linear-gradient(135deg,#ff2f98 0,#7d43ff 53%,#13cce7 100%);box-shadow:0 24px 50px #0007;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:190px;height:190px;border:30px solid #ffffff12;border-radius:50%}.hero .badge{display:inline-flex;background:#07091c66;border:1px solid #ffffff2b;border-radius:99px;padding:6px 9px;font-size:10px;font-weight:900}.hero h2{font-size:25px;margin:12px 0 8px;line-height:1.08}.hero p{margin:0 0 17px;font-size:13px;max-width:88%}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:900;background:#12182e;color:#fff}.btn.primary{background:linear-gradient(90deg,#ff2d98,#7c4dff)}.btn.light{background:#fff;color:#11152a}.btn.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}.stat,.panel,.feature{background:linear-gradient(180deg,#101a31,#0b1428);border:1px solid var(--line);border-radius:20px;padding:14px}.stat strong{font-size:26px;display:block;margin-top:6px}.section{padding:0 18px}.title{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px}.title h2{font-size:19px;margin:0}.feature{display:flex;gap:12px;align-items:center;margin-bottom:10px}.feature .ico{width:42px;height:42px;border-radius:13px;background:#172442;display:grid;place-items:center;font-size:21px;flex:none}.feature b{display:block;font-size:14px}.filters{display:flex;gap:8px;overflow:auto;padding:8px 18px 14px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid #26385f;background:#0f1830;color:#b9c7df;border-radius:99px;padding:10px 14px;white-space:nowrap;font-size:12px;font-weight:850}.chip.active{background:linear-gradient(90deg,#ff2e98,#7a4dff);color:#fff;border-color:transparent}.card{display:flex;gap:12px;padding:12px;margin-bottom:11px;border:1px solid #1e3158;background:linear-gradient(180deg,#0e1730,#0b1428);border-radius:20px}.thumb{width:72px;height:72px;border-radius:15px;display:grid;place-items:center;font-size:30px;flex:none;background:linear-gradient(135deg,#f72585,#4361ee)}.card h3{margin:1px 0 4px;font-size:14px}.card p{margin:0;color:#91a4c5;font-size:11px;line-height:1.4}.stats{margin-left:auto;color:#ff5cae;font-size:11px;font-weight:900;white-space:nowrap}.tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.tag{font-size:9px;background:#17234a;color:#a9c3ff;border:1px solid #263a69;border-radius:10px;padding:4px 7px;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:10px 2px;background:#111d3b;border:1px solid #23365f;border-radius:11px;text-align:center;font-size:10px;color:#95a9ca}.day b{display:block;color:#fff;font-size:13px;margin-top:4px}.day.on{background:linear-gradient(180deg,#ff2e98,#b23aff);border-color:transparent;color:#fff}.bar-label{display:flex;justify-content:space-between;font-size:11px;color:#9aacc9;margin:12px 0 6px}.bar{height:9px;background:#1a2747;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2e98,#7b4dff,#11cfe7)}.premium{background:linear-gradient(145deg,#1a153a,#271246 58%,#36144d);border-color:#824df466}.price{font-size:30px;font-weight:950}.status{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:99px;font-size:10px;font-weight:900;background:#ffb84d14;border:1px solid #ffb84d45;color:#ffd18c}.status.ok{background:#2de2a714;border-color:#2de2a745;color:#7bf3c8}.form{display:grid;gap:11px}.field label{display:block;font-size:11px;color:#aab9d3;font-weight:800;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid #2a3d64;background:#0a1328;color:#fff;border-radius:14px;padding:12px;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#6e67ff;box-shadow:0 0 0 3px #6e67ff18}.hint{font-size:10px;color:#7185a8;margin-top:5px}.modal{position:fixed;inset:0;background:#02050ddb;display:none;align-items:flex-end;z-index:30;backdrop-filter:blur(8px)}.sheet{width:min(520px,100%);margin:auto;background:linear-gradient(180deg,#0d1428,#080e1e);border:1px solid #25365b;border-bottom:0;border-radius:28px 28px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.grabber{width:42px;height:4px;background:#3d4b69;border-radius:8px;margin:0 auto 13px}.close{float:right;width:36px;height:36px;border-radius:12px;background:#17223e;border:1px solid #2b3d65;color:#fff}.idea-label{display:inline-flex;color:#ff79c0;font-weight:950;font-size:10px;letter-spacing:.09em;background:#ff3b9d14;border:1px solid #ff3b9d33;border-radius:999px;padding:6px 9px}.block{background:#111c39;border:1px solid #22365e;border-radius:15px;padding:14px;margin-top:10px;font-size:13px;line-height:1.55}.block b{display:block;margin-bottom:6px}.copy{float:right;background:#26375e;color:#fff;border:0;border-radius:8px;padding:5px 8px;font-size:10px}.loading{display:none;text-align:center;padding:22px}.spinner{width:34px;height:34px;border:4px solid #283b62;border-top-color:#ff3b9d;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:80px;background:#090d1ef5;border-top:1px solid #1d2a49;display:flex;justify-content:space-around;padding-top:7px;padding-bottom:env(safe-area-inset-bottom);z-index:9;backdrop-filter:blur(14px)}nav button{background:none;border:0;color:#7e90b1;font-size:10px;font-weight:750;min-width:60px}nav button.active{color:#ff62b4}.ni{font-size:21px;display:block;margin-bottom:3px}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 15px;border-radius:12px;font-weight:850;display:none;z-index:50;max-width:86%;text-align:center;font-size:12px}

.accountbar{margin:0 18px 14px;padding:13px 14px;border:1px solid #23365d;background:#0c1630;border-radius:18px;display:flex;gap:11px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#19d8ff,#7c4dff,#ff3b9d);font-weight:950}.grow{flex:1;min-width:0}.accountbar b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950;border:1px solid #2a3e69;background:#14213d;color:#bcd0f2}.pill.premium{border-color:#b45cff55;background:#9b43ff18;color:#dcbbff}.credits{display:flex;align-items:center;justify-content:space-between;gap:10px}.credit-number{font-size:30px;font-weight:950;letter-spacing:-1px}.credit-track{height:7px;background:#1b2949;border-radius:99px;overflow:hidden;margin-top:8px}.credit-track i{display:block;height:100%;background:linear-gradient(90deg,#13d4f0,#7a4dff,#ff3b9d)}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#080f20;border:1px solid #1c2b4d;padding:5px;border-radius:15px;margin:14px 0}.auth-tabs button{border:0;background:transparent;color:#8498bb;border-radius:11px;padding:9px;font-weight:850}.auth-tabs button.on{background:#172445;color:#fff}.legal{font-size:9px;color:#6f82a3;line-height:1.45;margin-top:10px}.danger{border:1px solid #ff587044!important;color:#ff94a5!important;background:#ff58700a!important}.row{display:flex;gap:8px}.row>*{flex:1}.mini{font-size:10px}.successbox{background:#2de2a70d;border:1px solid #2de2a73a;border-radius:15px;padding:12px;color:#aaf8df}.warningbox{background:#ffb84d0b;border:1px solid #ffb84d3b;border-radius:15px;padding:12px;color:#ffd498}.locked{opacity:.6;filter:saturate(.7)}
</style>
</head>
<body>
<div class="app"><header><div class="logo">Tik<span>Boost</span><b>↗</b></div><button class="icon-btn" onclick="openAccountAction()">👤</button></header><main id="main"></main></div>
<nav id="nav"><button data-page="home" class="active"><span class="ni">⌂</span>Inicio</button><button data-page="ideas"><span class="ni">💡</span>Ideas</button><button data-page="calendar"><span class="ni">▦</span>Calendario</button><button data-page="analytics"><span class="ni">▥</span>Análisis</button><button data-page="profile"><span class="ni">♙</span>Perfil</button></nav>
<div class="modal" id="modal"><div class="sheet"><div class="grabber"></div><button class="close" onclick="closeModal()">✕</button><div id="detail"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const starterIdeas=[
{cat:'Comida',emoji:'🍗',title:'El plato que todos preguntan',desc:'Presenta tu producto con una reacción y un dato breve.',views:'98K',hook:'Si amas la comida casera, mira esto…',script:'Plano del plato → detalle crujiente → prueba → reacción → pregunta final.',shot:'Primer plano del producto, textura y reacción.',text:'¿Tú lo pedirías así? 🔥',tags:'#Comida #Emprendimiento #ParaTi',strategy:'El detalle visual abre curiosidad y la pregunta final invita a comentar.'},
{cat:'Negocios',emoji:'📦',title:'Lo que nadie ve detrás de un pedido',desc:'Muestra el proceso real de tu negocio.',views:'81K',hook:'Esto pasa antes de que tu pedido llegue a tus manos…',script:'Preparación → detalle → empaque → resultado → entrega.',shot:'Planos cortos del proceso real.',text:'Detrás de cada pedido hay todo esto 👀',tags:'#Negocio #Emprendedores #DetrásDeCámaras',strategy:'Humaniza la marca y aumenta percepción de valor.'},
{cat:'Vida diaria',emoji:'✨',title:'Antes y después',desc:'Comparte una transformación breve.',views:'62K',hook:'Espera a ver cómo quedó al final…',script:'Antes → proceso → resultado → pregunta.',shot:'Mismo encuadre en antes y después.',text:'ANTES 😱 → DESPUÉS 🔥',tags:'#Transformación #AntesYDespués #ParaTi',strategy:'La promesa visual retiene hasta el resultado.'}
];
let page='home',filter='Todas',waiting=false,currentIdea=null,remoteConfig=null,account=null,billingPrice='S/ 9.90',billingStatus='loading';
const saved=()=>{try{return JSON.parse(localStorage.getItem('tb_saved')||'[]')}catch{return[]}};
const ideaCount=()=>Number(localStorage.getItem('tb_ideas')||0);
const aiUrl=()=>localStorage.getItem('tb_api_url')||'';
const getSession=()=>{try{return JSON.parse(localStorage.getItem('tb_session')||'null')}catch{return null}};
function setSession(s){if(s)localStorage.setItem('tb_session',JSON.stringify(s));else localStorage.removeItem('tb_session')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>x.style.display='none',2100)}
function head(k,h,s){return `<div class="page-head"><div class="eyebrow">${k}</div><h1>${h}</h1><p class="sub">${s}</p></div>`}
function tool(i,t,d,onclick=''){return `<div class="feature" ${onclick?`onclick="${onclick}"`:''}><div class="ico">${i}</div><div><b>${t}</b><div class="muted">${d}</div></div></div>`}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function parseEnvelope(t){let e;try{e=JSON.parse(t)}catch{return {status:0,data:{},error:'Respuesta inválida'}}let d={};try{d=e.body?JSON.parse(e.body):{}}catch{}return {status:e.httpStatus||0,data:d,error:e.error||d.error||''}}
function planName(){return account?.plan==='premium'?'Premium':'Gratis'}
function creditInfo(){const lim=Number(account?.daily_limit||remoteConfig?.freeDailyLimit||5),used=Number(account?.used||0),remaining=Math.max(0,Number(account?.remaining??(lim-used)));return {lim,used,remaining,pct:Math.max(0,Math.min(100,(remaining/Math.max(1,lim))*100))}}
function accountBar(){const s=getSession();if(!s)return `<div class="accountbar" onclick="openAuth('login')"><div class="avatar">↗</div><div class="grow"><b>Inicia sesión en TikBoost</b><span class="muted">Recibe créditos de IA y sincroniza Premium.</span></div><span class="pill">ENTRAR</span></div>`;const c=creditInfo();return `<div class="accountbar" onclick="page='profile';render()"><div class="avatar">${escapeHtml((s.user?.email||'T')[0].toUpperCase())}</div><div class="grow"><b>${escapeHtml(s.user?.email||'Mi cuenta')}</b><span class="muted">${c.remaining} de ${c.lim} créditos disponibles hoy</span></div><span class="pill ${account?.plan==='premium'?'premium':''}">${planName().toUpperCase()}</span></div>`}
function home(){const connected=!!aiUrl(),c=creditInfo(),signed=!!getSession();return `${accountBar()}${head('CREA · PRUEBA · CRECE','Tu copiloto creativo','Ideas con IA, créditos diarios y herramientas para crear contenido.')}<div class="hero"><span class="badge">✨ TIKBOOST AI</span><h2>Convierte tu negocio en una idea para grabar hoy</h2><p>Gancho, guion, planos, caption, hashtags y estrategia en segundos.</p><button class="btn light" onclick="openGenerator()">Generar con IA →</button></div><div class="grid"><div class="stat"><span class="muted">Créditos de hoy</span><strong>${signed?c.remaining:'—'}</strong></div><div class="stat"><span class="muted">Ideas guardadas</span><strong>${saved().length}</strong></div></div><section class="section"><div class="title"><h2>Tu cuenta</h2><span class="status ${connected?'ok':''}">${connected?'● Servidor listo':'● Configura servidor'}</span></div><div class="panel"><div class="credits"><div><b>${signed?planName():'Sin sesión'}</b><div class="muted">${signed?`${c.used} usadas · ${c.remaining} disponibles`:'Inicia sesión para usar IA real'}</div></div><div class="credit-number">${signed?c.remaining:'∞'}</div></div><div class="credit-track"><i style="width:${signed?c.pct:100}%"></i></div></div><div class="title"><h2>Herramientas</h2></div>${tool('🤖','Generador inteligente','Una generación consume 1 crédito diario.','openGenerator()')}${tool('🔖','Biblioteca','Guarda tus mejores ideas en el dispositivo.','openSaved()')}<div class="title"><h2>Premium</h2></div><div class="panel premium"><b>👑 TikBoost Premium</b><p class="muted">Hasta ${remoteConfig?.premiumDailyLimit||100} generaciones por día, acceso Premium y futuras funciones avanzadas.</p><div class="price">${escapeHtml(billingPrice)} <small>/ mes</small></div><button class="btn primary full" onclick="premium()">Ver Premium</button></div></section>`}
function ideasPage(){const cats=['Todas','Comida','Negocios','Vida diaria'];const arr=filter==='Todas'?starterIdeas:starterIdeas.filter(x=>x.cat===filter);return `${head('INSPIRACIÓN','Ideas para empezar','Ejemplos listos para adaptar a tu contenido.')}<div class="filters">${cats.map(c=>`<button class="chip ${filter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('')}</div><section class="section">${arr.map((x,i)=>ideaCard(x,i)).join('')}</section>`}
function ideaCard(x,i){return `<div class="card" onclick="openStarter(${i})"><div class="thumb">${x.emoji||'✨'}</div><div style="flex:1"><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.desc)}</p><div class="tags"><span class="tag">${escapeHtml(x.cat)}</span><span class="tag">🔥 Idea</span></div></div><div class="stats">${x.views||'IA'}</div></div>`}
function openStarter(i){openIdea(starterIdeas[i])}
function calendar(){return `${head('PLANIFICA','Calendario','Organiza una semana simple y constante.')}<section class="section"><div class="panel"><div class="calendar">${['L','M','X','J','V','S','D'].map((d,i)=>`<div class="day ${i===1||i===4?'on':''}">${d}<b>${14+i}</b></div>`).join('')}</div></div><div class="title"><h2>Plan sugerido</h2></div>${tool('💡','Lunes · Consejo rápido','6:30 p. m.')}${tool('🎬','Miércoles · Proceso real','7:30 p. m.')}${tool('🔥','Viernes · Producto estrella','7:00 p. m.')}${tool('💬','Domingo · Pregunta a la comunidad','6:00 p. m.')}</section>`}
function analytics(){const n=ideaCount();return `${head('MIDE','Análisis','Registra resultados y detecta qué formato funciona mejor.')}<section class="section"><div class="grid" style="padding:0"><div class="stat"><span class="muted">Ideas creadas</span><strong>${n}</strong></div><div class="stat"><span class="muted">Guardadas</span><strong>${saved().length}</strong></div></div><div class="title"><h2>Rendimiento demo</h2></div><div class="panel"><div class="bar-label"><span>Retención</span><b>68%</b></div><div class="bar"><i style="width:68%"></i></div><div class="bar-label"><span>Interacción</span><b>7.4%</b></div><div class="bar"><i style="width:74%"></i></div><div class="bar-label"><span>Constancia</span><b>82%</b></div><div class="bar"><i style="width:82%"></i></div><p class="muted" style="margin-top:13px">Estas métricas son demostrativas hasta conectar datos reales de redes sociales.</p></div></section>`}
function profile(){const u=aiUrl(),s=getSession(),c=creditInfo();return `${head('CONFIGURA','Perfil','Cuenta, créditos, Premium y conexión segura.')}<section class="section"><div class="panel"><b>Cuenta TikBoost</b>${s?`<p class="muted">Sesión iniciada como</p><h3 style="margin:4px 0">${escapeHtml(s.user?.email||'Usuario')}</h3><div class="row"><button class="btn full" onclick="refreshAccount()">Actualizar cuenta</button><button class="btn full danger" onclick="logout()">Cerrar sesión</button></div>`:`<p class="muted">Crea una cuenta para proteger tus créditos y activar Premium.</p><button class="btn primary full" onclick="openAuth('login')">Iniciar sesión</button><button class="btn full" style="margin-top:8px" onclick="openAuth('signup')">Crear cuenta</button>`}</div><div class="title"><h2>Uso de IA</h2></div><div class="panel"><div class="credits"><div><b>${planName()}</b><div class="muted">Límite diario: ${s?c.lim:'—'} generaciones</div></div><div class="credit-number">${s?c.remaining:'—'}</div></div><div class="credit-track"><i style="width:${s?c.pct:0}%"></i></div></div><div class="title"><h2>Premium</h2></div><div class="panel premium"><b>👑 TikBoost Premium</b><p class="muted">Compra administrada por Google Play. El servidor verifica la compra antes de activar beneficios.</p><div class="price">${escapeHtml(billingPrice)} <small>/ mes</small></div><button class="btn primary full" onclick="premium()">Administrar Premium</button></div><div class="title"><h2>Servidor</h2></div><div class="panel"><p class="muted">Guarda la URL HTTPS del backend de TikBoost. Las claves privadas permanecen en el servidor.</p><div class="field"><label>URL del backend</label><input id="apiUrlField" placeholder="https://tu-proyecto.vercel.app" value="${escapeHtml(u)}"><div class="hint">Sin /api/generate al final.</div></div><button class="btn primary full" style="margin-top:12px" onclick="saveApiUrl()">Guardar y cargar configuración</button><button class="btn full" style="margin-top:8px" onclick="testConnection()">Probar conexión</button></div></section>`}
function render(){document.getElementById('main').innerHTML=page==='home'?home():page==='ideas'?ideasPage():page==='calendar'?calendar():page==='analytics'?analytics():profile();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo(0,0)}
function setFilter(c){filter=c;render()}
function openAccountAction(){if(getSession()){page='profile';render()}else openAuth('login')}
function openAuth(mode='login'){if(!aiUrl()){toast('Primero configura el servidor en Perfil');page='profile';render();return}document.getElementById('detail').innerHTML=`<span class="idea-label">🔐 CUENTA TIKBOOST</span><h2>${mode==='signup'?'Crea tu cuenta':'Bienvenido de nuevo'}</h2><p class="muted">Tu cuenta conserva el plan y el límite de IA.</p><div class="auth-tabs"><button class="${mode==='login'?'on':''}" onclick="openAuth('login')">Entrar</button><button class="${mode==='signup'?'on':''}" onclick="openAuth('signup')">Crear cuenta</button></div><div class="form"><div class="field"><label>Correo</label><input id="authEmail" inputmode="email" autocomplete="email" placeholder="tu@correo.com"></div><div class="field"><label>Contraseña</label><input id="authPassword" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres"></div></div><button class="btn primary full" style="margin-top:14px" onclick="authSubmit('${mode}')">${mode==='signup'?'Crear cuenta':'Iniciar sesión'}</button><p class="legal">TikBoost usa Supabase Auth para la cuenta. Las claves administrativas no se guardan dentro de la app.</p>`;document.getElementById('modal').style.display='flex'}
async function authSubmit(mode){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;if(!email||password.length<6){toast('Ingresa correo y contraseña de mínimo 6 caracteres');return}if(!remoteConfig?.supabaseUrl||!remoteConfig?.supabaseAnonKey){await loadConfig();if(!remoteConfig?.supabaseUrl){toast('El servidor aún no tiene Supabase configurado');return}}try{const url=mode==='signup'?`${remoteConfig.supabaseUrl}/auth/v1/signup`:`${remoteConfig.supabaseUrl}/auth/v1/token?grant_type=password`;const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':remoteConfig.supabaseAnonKey,'Authorization':'Bearer '+remoteConfig.supabaseAnonKey},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||d.message||'No se pudo iniciar sesión');if(!d.access_token){toast('Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.');openAuth('login');return}setSession(d);closeModal();toast(mode==='signup'?'Cuenta creada ✅':'Sesión iniciada ✅');await refreshAccount();render()}catch(e){toast(e.message||'Error de autenticación')}}
function tokenExp(token){try{let p=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(atob(p)).exp||0}catch{return 0}}
async function ensureFreshSession(){let s=getSession();if(!s)return null;if(tokenExp(s.access_token)>Math.floor(Date.now()/1000)+120)return s;if(!s.refresh_token||!remoteConfig?.supabaseUrl)return s;try{const r=await fetch(`${remoteConfig.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json','apikey':remoteConfig.supabaseAnonKey},body:JSON.stringify({refresh_token:s.refresh_token})});const d=await r.json();if(r.ok&&d.access_token){setSession(d);return d}}catch{}return s}
function logout(){setSession(null);account=null;toast('Sesión cerrada');render()}
async function loadConfig(){const base=aiUrl();if(!base)return;if(window.Android&&typeof Android.getConfig==='function'){Android.getConfig(base);return}try{const r=await fetch(base+'/api/config');window.onTikBoostConfigResponse(JSON.stringify({httpStatus:r.status,body:await r.text()}))}catch(e){window.onTikBoostConfigResponse(JSON.stringify({httpStatus:0,error:e.message,body:''}))}}
window.onTikBoostConfigResponse=function(t){const x=parseEnvelope(t);if(x.status>=200&&x.status<300){remoteConfig=x.data;if(getSession())refreshAccount();render()}else if(x.error)toast(x.error)}
async function refreshAccount(){const s=await ensureFreshSession();if(!s||!aiUrl()){account=null;render();return}if(window.Android&&typeof Android.getAccount==='function'){Android.getAccount(aiUrl(),s.access_token);return}try{const r=await fetch(aiUrl()+'/api/account',{headers:{Authorization:'Bearer '+s.access_token}});window.onTikBoostAccountResponse(JSON.stringify({httpStatus:r.status,body:await r.text()}))}catch(e){window.onTikBoostAccountResponse(JSON.stringify({httpStatus:0,error:e.message,body:''}))}}
window.onTikBoostAccountResponse=function(t){const x=parseEnvelope(t);if(x.status>=200&&x.status<300){account=x.data.account||x.data;render()}else if(x.status===401){account=null;toast('Tu sesión expiró. Inicia sesión de nuevo.')}else if(x.error)toast(x.error)}
function openGenerator(){if(!getSession()){openAuth('login');return}const c=creditInfo();if(account&&c.remaining<=0){premium();return}document.getElementById('detail').innerHTML=`<span class="idea-label">✨ GENERAR CON IA</span><h2>¿Qué contenido quieres crear?</h2><p class="muted">1 generación = 1 crédito diario.</p><div class="form"><div class="field"><label>Negocio o nicho *</label><input id="gNiche" placeholder="Ej. restaurante de comida criolla, arquitectura, ropa"></div><div class="field"><label>Tema específico</label><textarea id="gTopic" placeholder="Ej. promocionar chicharrón, mostrar una entrega, captar clientes..."></textarea></div><div class="field"><label>Objetivo</label><select id="gGoal"><option>Aumentar alcance</option><option>Conseguir clientes</option><option>Vender un producto</option><option>Generar comentarios</option><option>Construir marca personal</option></select></div><div class="field"><label>Público</label><input id="gAudience" placeholder="Ej. jóvenes de 18 a 30 años"></div><div class="field"><label>Tono</label><select id="gTone"><option>Natural y dinámico</option><option>Elegante y profesional</option><option>Divertido</option><option>Cercano y familiar</option><option>Educativo</option></select></div><div class="field"><label>Plataforma</label><select id="gPlatform"><option>TikTok</option><option>Instagram Reels</option><option>Facebook Reels</option><option>YouTube Shorts</option></select></div><div class="field"><label>Duración</label><select id="gDuration"><option>15 segundos</option><option selected>30 segundos</option><option>45 segundos</option><option>60 segundos</option></select></div></div><button class="btn primary full" style="margin-top:14px" onclick="generateAI()">✨ Crear idea con IA</button><div class="loading" id="aiLoading"><div class="spinner"></div><b>Creando tu idea…</b><p class="muted">Puede tardar unos segundos.</p></div>`;document.getElementById('modal').style.display='flex'}
async function generateAI(){if(waiting)return;const base=aiUrl(),s=await ensureFreshSession();if(!base){toast('Configura el servidor');return}if(!s){openAuth('login');return}const niche=document.getElementById('gNiche').value.trim();if(!niche){toast('Escribe tu negocio o nicho');return}const payload={niche,topic:document.getElementById('gTopic').value.trim(),goal:document.getElementById('gGoal').value,audience:document.getElementById('gAudience').value.trim(),tone:document.getElementById('gTone').value,platform:document.getElementById('gPlatform').value,duration:document.getElementById('gDuration').value};waiting=true;document.getElementById('aiLoading').style.display='block';if(window.Android&&typeof Android.generateIdea==='function'){Android.generateIdea(base,JSON.stringify(payload),s.access_token);return}fetch(base+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify(payload)}).then(async r=>window.onTikBoostAIResponse(JSON.stringify({httpStatus:r.status,body:await r.text()}))).catch(e=>window.onTikBoostAIResponse(JSON.stringify({httpStatus:0,error:e.message,body:''})))}
window.onTikBoostAIResponse=function(t){waiting=false;const x=parseEnvelope(t);const l=document.getElementById('aiLoading');if(l)l.style.display='none';if(x.status<200||x.status>=300){if(x.status===402){account=x.data.account||account;premium()}else toast(x.error||'No se pudo generar la idea');return}if(!x.data.idea){toast('La IA no devolvió una idea');return}if(x.data.account)account=x.data.account;localStorage.setItem('tb_ideas',ideaCount()+1);openIdea({...x.data.idea,views:'IA'})}
function openIdea(x){currentIdea=x;document.getElementById('detail').innerHTML=`<span class="idea-label">🔥 IDEA · ${escapeHtml((x.cat||'Contenido').toUpperCase())}</span><h2>${escapeHtml(x.emoji||'✨')} ${escapeHtml(x.title)}</h2><p class="muted">${escapeHtml(x.desc||'')}</p>${[['🔗 Gancho',x.hook],['📝 Guion',x.script],['🎥 Qué grabar',x.shot],['Aa Caption',x.text],['# Hashtags',x.tags],['🧠 Estrategia',x.strategy]].map(([a,b])=>`<div class="block"><button class="copy" onclick="copyText(currentIdeaField('${a}'))">Copiar</button><b>${a}</b>${escapeHtml(b||'')}</div>`).join('')}<button class="btn primary full" style="margin-top:14px" onclick="saveCurrentIdea()">🔖 Guardar idea</button><button class="btn full" style="margin-top:9px" onclick="shareCurrentIdea()">↗ Compartir idea</button>`;document.getElementById('modal').style.display='flex'}
function currentIdeaField(label){const map={'🔗 Gancho':'hook','📝 Guion':'script','🎥 Qué grabar':'shot','Aa Caption':'text','# Hashtags':'tags','🧠 Estrategia':'strategy'};return currentIdea?.[map[label]]||''}
function saveCurrentIdea(){if(!currentIdea)return;const a=saved();if(!a.some(i=>i.title===currentIdea.title)){a.push(currentIdea);localStorage.setItem('tb_saved',JSON.stringify(a));toast('Idea guardada')}else toast('Ya estaba guardada')}
function openSaved(){const a=saved();document.getElementById('detail').innerHTML=`<span class="idea-label">🔖 GUARDADAS</span><h2>Tu biblioteca</h2><p class="muted">Ideas guardadas en este dispositivo.</p>${a.length?a.map((x,i)=>`<div class="block" onclick="openSavedAt(${i})"><button class="copy" onclick="event.stopPropagation();removeSaved(${i})">Quitar</button><b>${escapeHtml(x.emoji||'✨')} ${escapeHtml(x.title||'Idea')}</b><span class="muted">${escapeHtml(x.cat||'Contenido')}</span></div>`).join(''):'<div class="block">Aún no tienes ideas guardadas.</div>'}`;document.getElementById('modal').style.display='flex'}
function openSavedAt(i){const a=saved();if(a[i])openIdea(a[i])}
function removeSaved(i){const a=saved();a.splice(i,1);localStorage.setItem('tb_saved',JSON.stringify(a));openSaved();toast('Idea eliminada')}
function closeModal(){document.getElementById('modal').style.display='none'}
async function copyText(t){try{if(window.Android&&typeof Android.copyText==='function'){Android.copyText(t);toast('Copiado');return}await navigator.clipboard.writeText(t);toast('Copiado')}catch{toast('No se pudo copiar')}}
function shareCurrentIdea(){if(!currentIdea)return;const x=currentIdea,t=`${x.title}

Gancho: ${x.hook}
Guion: ${x.script}
Qué grabar: ${x.shot}
Caption: ${x.text}
Hashtags: ${x.tags}`;if(window.Android&&typeof Android.shareText==='function'){Android.shareText(t);return}if(navigator.share)navigator.share({title:'TikBoost',text:t}).catch(()=>{});else copyText(t)}
function saveApiUrl(){const el=document.getElementById('apiUrlField');let v=el.value.trim().replace(/\/$/,'');if(v&&!/^https:\/\//i.test(v)){toast('La URL debe empezar con https://');return}localStorage.setItem('tb_api_url',v);remoteConfig=null;account=null;toast('Servidor guardado');loadConfig();render()}
async function testConnection(){const base=(document.getElementById('apiUrlField')?.value||aiUrl()).trim().replace(/\/$/,'');if(!base){toast('Pega primero la URL del servidor');return}if(window.Android&&typeof Android.testServer==='function'){Android.testServer(base);return}try{const r=await fetch(base+'/api/health');if(!r.ok)throw new Error();toast('Servidor conectado ✅')}catch{toast('No se pudo conectar al servidor')}}
window.onTikBoostHealthResponse=function(t){const x=parseEnvelope(t);if(x.status>=200&&x.status<300)toast('Servidor conectado ✅');else toast(x.error||'No se pudo conectar al servidor')}
function premium(){const s=getSession();if(!s){openAuth('login');return}document.getElementById('detail').innerHTML=`<span class="idea-label">👑 PREMIUM</span><h2>TikBoost Premium</h2><p class="muted">Más IA cada día y funciones Premium administradas desde tu cuenta.</p><div class="block"><b>Incluye</b>✓ Hasta ${remoteConfig?.premiumDailyLimit||100} generaciones por día<br>✓ Acceso Premium sincronizado con tu cuenta<br>✓ Restauración de compra<br>✓ Base preparada para nuevas herramientas</div><div class="price" style="margin-top:18px">${escapeHtml(billingPrice)} <small>/ mes</small></div>${account?.plan==='premium'?'<div class="successbox" style="margin-top:12px">✓ Tu cuenta tiene Premium activo.</div>':'<button class="btn primary full" style="margin-top:14px" onclick="buyPremium()">Comprar con Google Play</button>'}<button class="btn full" style="margin-top:8px" onclick="restorePremium()">Restaurar compra</button><p class="legal">La compra solo activa Premium después de ser verificada por el servidor con Google Play.</p>`;document.getElementById('modal').style.display='flex';if(window.Android&&Android.queryPremiumPrice)Android.queryPremiumPrice()}
function buyPremium(){const s=getSession();if(!s){openAuth('login');return}if(!window.Android||typeof Android.purchasePremium!=='function'){toast('Las compras funcionan dentro del APK instalado desde Google Play');return}Android.purchasePremium(s.user?.id||'')}
function restorePremium(){if(!window.Android||typeof Android.restorePremium!=='function'){toast('Abre la app Android para restaurar la compra');return}Android.restorePremium()}
window.onTikBoostBillingProduct=function(t){let d;try{d=JSON.parse(t)}catch{return}billingStatus=d.status||billingStatus;if(d.price)billingPrice=d.price;if(d.status==='not_configured')console.log(d.message||'Producto no configurado');render()}
window.onTikBoostPurchase=async function(t){let d;try{d=JSON.parse(t)}catch{return}if(d.status==='cancelled'){toast('Compra cancelada');return}if(d.status==='pending'){toast('Pago pendiente. Premium se activará al confirmarse.');return}if(d.status==='none'){toast(d.message||'No hay compra para restaurar');return}if(d.status==='error'){toast(d.message||'Error de Google Play');return}if(d.status!=='purchased'||!d.purchaseToken)return;const s=await ensureFreshSession();if(!s||!aiUrl())return;toast('Verificando compra…');if(window.Android&&typeof Android.verifyPurchase==='function')Android.verifyPurchase(aiUrl(),d.purchaseToken,d.productId,s.access_token)}
window.onTikBoostVerifyPurchaseResponse=function(t){const x=parseEnvelope(t);if(x.status>=200&&x.status<300){account=x.data.account||account;toast('Premium activado 👑');render();premium()}else toast(x.error||'No se pudo verificar la compra')}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function bootstrap(){render();if(aiUrl())loadConfig();if(window.Android&&typeof Android.queryPremiumPrice==='function')Android.queryPremiumPrice()}
bootstrap();
</script>
</body>
</html>
